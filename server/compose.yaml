services:
  devbox-server:
    image: ghcr.io/the3dsandwich/devbox-cli/server:latest
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      PROXMOX_HOST: ${PROXMOX_HOST}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET}
      PROXMOX_NODE: ${PROXMOX_NODE:-pve}
      PROXMOX_TEMPLATE_VMID: ${PROXMOX_TEMPLATE_VMID:-200}
      API_TOKEN: ${API_TOKEN}
      DEVBOX_DOMAIN: ${DEVBOX_DOMAIN:-devbox.local}
      DB_PATH: /data/devbox.db
    volumes:
      - devbox-data:/data

volumes:
  devbox-data:
